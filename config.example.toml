# termul configuration — copy to:
#   Linux:  ~/.config/termul/config.toml
#   macOS:  ~/Library/Application Support/termul/config.toml
#
# Every field is optional; omitted fields fall back to the defaults shown below.
# An invalid value (bad color/keybind) is ignored and the default is kept.

[appearance]
# Bảng màu (hex "#rrggbb"). Bỏ trường nào thì dùng mặc định bên dưới.
bg = "#282a36"      # nền popup/tabbar + tab active
accent = "#cba6f7"  # viền + highlight mục đang chọn
green = "#a6e3a1"   # dòng history cùng thư mục (cwd)
blue = "#89b4fa"    # viền pane đang focus
red = "#f38ba8"     # popup xác nhận (đóng pane/tab — hành động phá huỷ)
yellow = "#f9e2af"  # chỉ báo cuộn ▲▼ trong popup gợi ý
# Độ rộng tối thiểu của một tab trên tab bar.
tab_min_width = 6

[behavior]
# Autocomplete popup: max rows shown at once, and how many matches to fetch.
suggest_max_visible = 10
suggest_fetch = 50

[mention]
# Pattern kiểu .gitignore, tính tương đối từ cwd của pane.
exclude = ["target/", "*.log", "secrets/**"]

[keys]
# Modifier combos: "ctrl+b", "alt+x", "shift+enter", or a bare key like "enter".
prefix = "ctrl+b"          # enter prefix mode
quit = "ctrl+q"            # quit immediately

# Single-character commands pressed AFTER the prefix key.
split_right = "%"          # split left/right
split_down = "\""          # split top/bottom
close_pane = "x"           # close focused pane
tab_new = "c"              # new tab
tab_next = "n"             # next tab
tab_prev = "p"             # previous tab
tab_rename = ","           # rename current tab
tab_close = "&"            # close current tab
palette = "r"              # open history palette
quit_action = "q"          # quit (in prefix mode)
